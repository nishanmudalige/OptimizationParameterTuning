name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: OpenMP runtime for XGBoost (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install pinned dependencies and the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Show resolved paths and versions
        run: python -m memtune info
      - name: Regression tests (sample and full dataset)
        run: python -m pytest
      - name: Notebook tests (one runner is enough)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install -r requirements-notebooks.txt
          python -m pytest tests/test_notebooks.py

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t memtune .
      - name: Recompute the results inside the container
        run: docker run --rm memtune
      - name: Run the tests inside the container
        run: docker run --rm memtune python -m pytest
