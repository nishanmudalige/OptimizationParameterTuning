name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.6.9
      - run: python -m ruff check .
      - name: install.sh has valid syntax
        run: bash -n install.sh && bash -n scripts/setup.sh

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: OpenMP runtime for XGBoost (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install pinned dependencies and the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Check the installation
        run: python -m memtune doctor
      - name: Reproduce the paper's results
        run: python -m memtune reproduce
      - name: Tests (sample and full dataset)
        run: python -m pytest
      - name: Notebook tests (one runner is enough)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install -r requirements-notebooks.txt
          python -m pytest tests/test_notebooks.py

  installer:
    # The installer exactly as a user runs it, from a fresh checkout, on every system.
    name: Installer / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: System report
        run: ./install.sh --detect
      - name: The bash that ships with macOS (3.2) runs the installer
        if: runner.os == 'macOS'
        run: |
          /bin/bash --version | head -1
          /bin/bash install.sh --yes --dry-run --full
      - name: Install (recommended setup, no questions)
        run: ./install.sh --yes
      - name: Use the installed environment
        run: |
          if [ -x .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m memtune reproduce
          test -f site/data/index.json
      - name: Running it again keeps the environment
        run: ./install.sh --yes --minimal | tee again.log && grep -q "Reuse the existing .venv" again.log
      - name: PowerShell entry point (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File install.ps1 --detect
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Conda path (Linux)
        if: runner.os == 'Linux'
        run: |
          export PATH="$CONDA/bin:$PATH"
          ./install.sh --yes --env conda --minimal
          conda run -n memtune python -m memtune reproduce

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image with the installer
        run: ./install.sh --yes --env docker
      - name: Recompute the results inside the container
        run: docker run --rm memtune python -m memtune reproduce
      - name: Run the tests inside the container
        run: docker run --rm memtune python -m pytest
