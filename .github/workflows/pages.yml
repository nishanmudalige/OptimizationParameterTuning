name: demo site

# Builds the interactive demo (site/) and publishes it on GitHub Pages.
# One-time setup by a repository admin: Settings -> Pages -> Source: "GitHub Actions".
# Until then the site is still built and tested, and the deploy step is skipped with a notice.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Precompute the demo data
        run: python scripts/export_demo_data.py
      - name: Test the demo data
        run: python -m pytest tests/test_demo_site.py
      - name: Is GitHub Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repository. An admin can enable it under Settings -> Pages -> Source: GitHub Actions. The demo was built and tested but not published."
          fi
      - uses: actions/configure-pages@v6
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
